[build-system]
requires = ["setuptools>=68", "wheel", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[project]
name = "eclosure"
version = "0.1.1"
description = "Python bindings and utilities for closed e-BH and closed BY procedures"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "BNP multiple testing team" }
]
license = "GPL-3.0-only"
dependencies = [
  "numpy>=1.22",
]

[project.optional-dependencies]
experiments = [
  "pandas>=1.5",
  "scipy>=1.9",
  "tqdm>=4.65"
]
plotting = [
  "matplotlib>=3.6",
  "seaborn>=0.12"
]
test = [
  "pytest>=7.0",
  "pandas>=1.5",
  "scipy>=1.9",
  "tqdm>=4.65"
]
dev = [
  "pybind11>=2.11",
  "pytest>=7.0",
  "pandas>=1.5",
  "scipy>=1.9",
  "tqdm>=4.65",
  "matplotlib>=3.6",
  "seaborn>=0.12"
]

[tool.setuptools.packages.find]
where = ["python/src"]

[tool.setuptools.package-data]
"eclosure" = ["data/evalues/*.csv", "data/pvalues/*.csv"]
